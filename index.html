<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecureChat</title>
<meta name="description" content="SecureChat, a private messenger for iPhone.">
<style>
  :root { --bg: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --link: #0a66c2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111111; --fg: #f5f5f7; --muted: #a1a1a6; --link: #6cb4ff; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 4px; }
  p { color: var(--muted); }
  a { color: var(--link); overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
<h1>SecureChat</h1>
<p>A private messenger for iPhone.</p>
</main>
</body>
</html>
